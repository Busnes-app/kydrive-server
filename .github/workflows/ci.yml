name: KyDrive CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: stable
          check-latest: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 26
      - run: sudo apt-get update && sudo apt-get install -y restic
      # web/dist is built here, not committed, so the Go steps embed the bundle from this commit.
      - run: cd web && npm ci && npm test && npm run build && npm audit --audit-level=high
      - run: go test -race ./... && go vet ./...
      # The release binary must not depend on where it is built: build it the way the
      # Dockerfile does (no .git in the context, web/dist rebuilt from the lockfile, -trimpath)
      # from two directories and require identical bytes. docs/VERIFYING-RELEASES.md tells
      # users how to repeat this against a release image.
      - name: release binary is repeatable
        run: |
          set -euo pipefail
          ld="-s -w -X github.com/Busnes-app/kydrive-server/internal/appversion.release=0.0.0"
          for d in "$RUNNER_TEMP/a" "$RUNNER_TEMP/elsewhere/b"; do
            mkdir -p "$d/src"
            git archive HEAD | tar -x -C "$d/src"
            (cd "$d/src/web" && npm ci --no-audit --no-fund && npm run build)
            (cd "$d/src" && CGO_ENABLED=0 GOOS=linux go build -trimpath -ldflags="$ld" -o "$d/kydrive-server" ./cmd/server)
          done
          sha256sum "$RUNNER_TEMP/a/kydrive-server" "$RUNNER_TEMP/elsewhere/b/kydrive-server"
          cmp "$RUNNER_TEMP/a/kydrive-server" "$RUNNER_TEMP/elsewhere/b/kydrive-server"
      # Timing bounds skip under -race; run them once in a normal build.
      - run: go test -count=1 -run 'TestSearchScale' ./internal/drive/
      - run: test -z "$(gofmt -l $(git ls-files '*.go'))" && go mod verify
      - run: go mod tidy && git diff --exit-code go.mod go.sum
      - run: go build -o .browser/server ./cmd/server && cd web && npx playwright install --with-deps chromium && npm run test:browser
      - run: python -m unittest discover -s deploy -p '*_test.py'
      - run: go build -o kydrive-server ./cmd/server && scripts/smoke-test.sh
      - run: docker build --platform linux/amd64 --build-arg SOURCE_REVISION="$GITHUB_SHA" -t kydrive-server:ci .
      - if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: docker save kydrive-server:ci | gzip > tested-image.tar.gz
      - if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: tested-image
          path: tested-image.tar.gz
          retention-days: 7
  publish:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: tested-image
      - run: docker load < tested-image.tar.gz
      - env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - id: push
        run: |
          set -euo pipefail
          name="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/kydrive-server"
          docker tag kydrive-server:ci "$name:$GITHUB_SHA"
          docker push "$name:$GITHUB_SHA"
          digest="$(docker buildx imagetools inspect "$name:$GITHUB_SHA" --format '{{.Manifest.Digest}}')"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-name: ${{ steps.push.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NAME: ${{ steps.push.outputs.name }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          gh attestation verify "oci://$NAME@$DIGEST" --repo "$GITHUB_REPOSITORY" \
            --cert-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/ci.yml@refs/heads/master"

