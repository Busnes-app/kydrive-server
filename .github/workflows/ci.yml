name: KyDrive CI
on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
permissions:
  contents: read
# A new push supersedes a pull request's run. Every other run gets its own group: a shared
# one would cancel a pending master run, leaving its commit without an image.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # The race and strong-key passes run beside everything else.
  # The real-password API suite can exceed Go's 10-minute package default.
  race:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 26
      - run: sudo apt-get update && sudo apt-get install -y restic
      # web/dist is built, not committed; the Go packages embed it.
      - run: cd web && npm ci && npm run build
      - run: go test -race -count=1 -timeout=20m ./... && go vet ./...

  fips:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 26
      - run: sudo apt-get update && sudo apt-get install -y restic
      - run: cd web && npm ci && npm run build
      - name: test supported strong-key profile
        env:
          GODEBUG: fips140=on
        run: go test -race -count=1 -timeout=20m ./...

  # The same suite on PostgreSQL (internal/testdb). Tests SQLite alone can run skip themselves.
  postgres:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18.7-alpine3.24@sha256:0115267ab5a509022df9319c77be365cef335adb71556c75f60f5360ee247e71
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 26
      - run: sudo apt-get update && sudo apt-get install -y restic
      - run: cd web && npm ci && npm run build
      # The hosted install's object storage: an S3-compatible server that checks signatures. A
      # service container cannot take a command, so it starts here.
      - name: start S3-compatible server
        run: |
          docker run -d --name s3 -p 127.0.0.1:8333:8333 -v "$PWD/.github/ci/seaweedfs-s3.json:/etc/s3.json:ro" \
            chrislusf/seaweedfs:4.52@sha256:57877e32bb90073b37dc109b438ba66e84fd5ed9ced5f5c04f56444ef243ce59 \
            server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/s3.json
          for _ in $(seq 60); do curl -s -o /dev/null http://127.0.0.1:8333 && exit 0; sleep 1; done
          docker logs s3; exit 1
      - env:
          KY_TEST_POSTGRES_DSN: postgres://postgres:ci@127.0.0.1:5432/postgres?sslmode=disable
          KY_TEST_S3_ENDPOINT: http://127.0.0.1:8333
          KY_TEST_S3_BUCKET: kydrive-ci
          KY_TEST_S3_ACCESS_KEY: kydrive-ci
          KY_TEST_S3_SECRET_KEY: kydrive-ci-secret-not-a-real-credential
        run: go test -race -count=1 -timeout=20m ./...

  checks:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        with:
          go-version-file: go.mod
          # Own cache key: the race legs keep their -race build cache.
          cache-dependency-path: |
            go.sum
            web/package-lock.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 26
      - run: scripts/check-no-binaries.sh
      - run: node --test deploy/vault-gateway/netflux.test.mjs
      - run: scripts/check-test-build-tag.sh
      # web/dist is built here, not committed, so the Go steps embed the bundle from this commit.
      - run: cd web && npm ci && npm test && npm run build && npm audit --audit-level=high
      - name: profile preserves Compose configuration
        run: python3 docs/check-strong-crypto-compose.py
      - name: verify hybrid PQ TLS and refuse classical overrides
        run: scripts/check-pqc-tls.sh
      # The release binary must not depend on where it is built: build it the way the
      # Dockerfile does (no .git in the context, web/dist rebuilt from the lockfile, -trimpath)
      # from two directories and require identical bytes. docs/VERIFYING-RELEASES.md tells
      # users how to repeat this against a release image.
      - name: release binary is repeatable
        run: |
          set -euo pipefail
          ld="-s -w -X github.com/Busnes-app/kydrive-server/internal/appversion.release=0.0.0"
          for d in "$RUNNER_TEMP/a" "$RUNNER_TEMP/elsewhere/b"; do
            mkdir -p "$d/src"
            git archive HEAD | tar -x -C "$d/src"
            (cd "$d/src/web" && npm ci --no-audit --no-fund && npm run build)
            (cd "$d/src" && CGO_ENABLED=0 GOOS=linux go build -trimpath -ldflags="$ld" -o "$d/kydrive-server" ./cmd/server)
          done
          sha256sum "$RUNNER_TEMP/a/kydrive-server" "$RUNNER_TEMP/elsewhere/b/kydrive-server"
          cmp "$RUNNER_TEMP/a/kydrive-server" "$RUNNER_TEMP/elsewhere/b/kydrive-server"
      # Timing bounds skip under -race; run them once in a normal build.
      - run: go test -count=1 -run 'TestSearchScale' ./internal/drive/
      - run: test -z "$(gofmt -l $(git ls-files '*.go'))" && go mod verify
      - run: go mod tidy && git diff --exit-code go.mod go.sum
      - run: go build -o .browser/server ./cmd/server && cd web && npx playwright install --with-deps chromium && npm run test:browser
      - run: python -m unittest discover -s deploy -p '*_test.py'
      - run: go build -o kydrive-server ./cmd/server && scripts/smoke-test.sh
      - run: docker build --platform linux/amd64 --build-arg SOURCE_REVISION="$GITHUB_SHA" -t kydrive-server:ci .
      - name: Image is a release build
        run: scripts/check-release-image.sh kydrive-server:ci
      - if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: docker save kydrive-server:ci | gzip > tested-image.tar.gz
      - if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: tested-image
          path: tested-image.tar.gz
          retention-days: 7

  # The required check and release-image.yml's REQUIRED name: green only if every leg passed.
  test:
    needs: [race, fips, postgres, checks]
    if: (always()) && github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: test "${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && !contains(needs.*.result, 'skipped') }}" = true

  publish:
    needs: [race, fips, postgres, checks, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: tested-image
      - run: docker load < tested-image.tar.gz
      - env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - id: push
        run: |
          set -euo pipefail
          name="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/kydrive-server"
          docker tag kydrive-server:ci "$name:$GITHUB_SHA"
          docker push "$name:$GITHUB_SHA"
          digest="$(docker buildx imagetools inspect "$name:$GITHUB_SHA" --format '{{.Manifest.Digest}}')"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-name: ${{ steps.push.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NAME: ${{ steps.push.outputs.name }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          gh attestation verify "oci://$NAME@$DIGEST" --repo "$GITHUB_REPOSITORY" \
            --cert-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/ci.yml@refs/heads/master"

